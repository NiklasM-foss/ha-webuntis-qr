<?xml version="1.0" encoding="UTF-8"?>
<!--
  Projekt-Icon der WebUntis-QR-Integration.
  Motiv: Doktorhut + QR-Eckmarker -> Schule + QR-Code-Login.
  Farbschema lehnt sich an Untis-Orange/Schwarz an.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hintergrund: abgerundetes Quadrat in Untis-Orange -->
  <rect x="0" y="0" width="256" height="256" rx="48" ry="48" fill="#F49F25"/>

  <!-- Doktorhut: Boden -->
  <path d="M40 110 L128 70 L216 110 L128 150 Z" fill="#1a1a1a"/>
  <!-- Hutband / Unterseite -->
  <path d="M72 132 L72 168 C72 184 96 196 128 196 C160 196 184 184 184 168 L184 132 L128 154 Z" fill="#1a1a1a"/>
  <!-- Quaste -->
  <line x1="200" y1="118" x2="200" y2="170" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="178" r="10" fill="#1a1a1a"/>

  <!-- QR-Eckmarker links unten – zitiert den QR-Login-Mechanismus -->
  <g transform="translate(28 196)">
    <rect width="32" height="32" rx="4" fill="#1a1a1a"/>
    <rect x="6" y="6" width="20" height="20" rx="2" fill="#F49F25"/>
    <rect x="12" y="12" width="8" height="8" fill="#1a1a1a"/>
  </g>
</svg>
